<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#0e1820">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>دار التحفيظ — تسجيل الدخول</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700;900&display=swap"
    rel="stylesheet">

  <!-- Website Icon -->
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="shortcut icon" href="images/logo.png">
  <link rel="apple-touch-icon" href="images/logo.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%;
      font-family: 'Cairo', sans-serif;
      background: #0e1820;
      color: #fff;
      direction: rtl;
      overflow-x: hidden
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: radial-gradient(ellipse at 15% 50%, rgba(26, 107, 58, .28) 0%, transparent 55%), radial-gradient(ellipse at 85% 15%, rgba(181, 130, 10, .16) 0%, transparent 50%), #0e1820
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      opacity: .03;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpolygon points='30,3 57,16.5 57,43.5 30,57 3,43.5 3,16.5' fill='none' stroke='white' stroke-width='1'/%3E%3C/svg%3E")
    }

    .floaters {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden
    }

    .fi {
      position: absolute;
      bottom: -60px;
      opacity: 0;
      animation: floatUp linear infinite;
      filter: blur(1px)
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0
      }

      10% {
        opacity: .05
      }

      90% {
        opacity: .05
      }

      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0
      }
    }

    .wrap {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      padding-top: max(20px, env(safe-area-inset-top));
      padding-bottom: max(20px, env(safe-area-inset-bottom))
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: rgba(255, 255, 255, .05);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, .09);
      border-radius: 24px;
      padding: 38px 32px;
      box-shadow: 0 40px 80px rgba(0, 0, 0, .5);
      animation: cardIn .5s cubic-bezier(.16, 1, .3, 1) both
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(24px) scale(.97)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .logo {
      text-align: center;
      margin-bottom: 28px
    }

    .logo-icon {
      font-size: 2.8rem;
      display: block;
      margin-bottom: 10px;
      animation: bob 4s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(212, 160, 23, .45))
    }

    @keyframes bob {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-9px)
      }
    }

    .logo-name {
      font-family: 'Amiri', serif;
      font-size: 1.6rem;
      color: #fff;
      line-height: 1.3;
      margin-bottom: 4px
    }

    .logo-name em {
      color: #d4a017;
      font-style: normal
    }

    .logo-sub {
      font-size: .73rem;
      color: rgba(255, 255, 255, .33)
    }

    .tabs {
      display: flex;
      gap: 4px;
      background: rgba(0, 0, 0, .25);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 22px
    }

    .tab {
      flex: 1;
      padding: 10px 8px;
      border-radius: 11px;
      font-family: 'Cairo', sans-serif;
      font-size: .84rem;
      font-weight: 700;
      color: rgba(255, 255, 255, .4);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all .22s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      -webkit-tap-highlight-color: transparent
    }

    .tab i {
      font-size: .78rem
    }

    .tab.active {
      background: linear-gradient(135deg, rgba(26, 107, 58, .6), rgba(26, 107, 58, .3));
      color: #fff;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .3);
      border: 1px solid rgba(26, 107, 58, .35)
    }

    .field {
      margin-bottom: 14px
    }

    .field label {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: .73rem;
      font-weight: 700;
      color: rgba(255, 255, 255, .42);
      margin-bottom: 7px;
      letter-spacing: .3px;
      text-transform: uppercase
    }

    .field label i {
      font-size: .68rem
    }

    .fw {
      position: relative
    }

    .input {
      width: 100%;
      padding: 13px 42px 13px 42px;
      background: rgba(255, 255, 255, .07);
      border: 1.5px solid rgba(255, 255, 255, .09);
      border-radius: 12px;
      font-family: 'Cairo', sans-serif;
      font-size: .92rem;
      color: #fff;
      outline: none;
      transition: all .2s;
      -webkit-appearance: none
    }

    .input::placeholder {
      color: rgba(255, 255, 255, .2)
    }

    .input:focus {
      border-color: rgba(26, 107, 58, .7);
      background: rgba(26, 107, 58, .1);
      box-shadow: 0 0 0 3px rgba(26, 107, 58, .15)
    }

    .input.err {
      border-color: rgba(190, 58, 43, .7)
    }

    .fi-ico {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      opacity: .38;
      font-size: .82rem;
      pointer-events: none
    }

    .eye {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: .82rem;
      opacity: .38;
      color: #fff;
      transition: opacity .18s;
      padding: 4px;
      -webkit-tap-highlight-color: transparent
    }

    .eye:hover {
      opacity: .9
    }

    .err-box {
      background: rgba(190, 58, 43, .12);
      border: 1px solid rgba(190, 58, 43, .25);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: .8rem;
      color: #e87c72;
      margin-bottom: 14px;
      display: none;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .err-box i {
      flex-shrink: 0
    }

    .submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #1a6b3a 0%, #22944f 100%);
      color: #fff;
      border: none;
      border-radius: 13px;
      font-family: 'Cairo', sans-serif;
      font-size: .97rem;
      font-weight: 700;
      cursor: pointer;
      transition: all .22s;
      box-shadow: 0 4px 24px rgba(26, 107, 58, .45);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      -webkit-tap-highlight-color: transparent;
      margin-top: 4px
    }

    .submit:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 28px rgba(26, 107, 58, .55)
    }

    .submit:active {
      transform: scale(.98)
    }

    .submit:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none
    }

    .spin {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, .3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: rot .7s linear infinite
    }

    @keyframes rot {
      to {
        transform: rotate(360deg)
      }
    }

    .verse {
      text-align: center;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, .06)
    }

    .verse p {
      font-family: 'Amiri', serif;
      font-size: .93rem;
      color: rgba(212, 160, 23, .72);
      line-height: 1.8
    }

    .foot {
      text-align: center;
      margin-top: 16px;
      font-size: .67rem;
      color: rgba(255, 255, 255, .17)
    }

    @media(max-width:480px) {
      .card {
        padding: 30px 20px;
        border-radius: 20px
      }

      .logo-icon {
        font-size: 2.4rem
      }

      .logo-name {
        font-size: 1.4rem
      }

      .input {
        font-size: 16px;
        padding: 14px 42px
      }
    }

    @media(max-width:360px) {
      .wrap {
        padding: 10px
      }

      .card {
        padding: 26px 16px
      }
    }
  </style>
</head>

<body>
  <div class="bg"></div>
  <div class="bg-grid"></div>
  <div class="floaters">
    <div class="fi" style="left:8%;animation-duration:18s;font-size:1.6rem"><i class="fa-solid fa-mosque"
        style="color:#d4a017"></i></div>
    <div class="fi" style="left:23%;animation-duration:22s;animation-delay:5s;font-size:1rem"><i
        class="fa-solid fa-star-and-crescent" style="color:#1a6b3a"></i></div>
    <div class="fi" style="left:46%;animation-duration:16s;animation-delay:9s;font-size:1.6rem"><i
        class="fa-solid fa-moon" style="color:#b5820a"></i></div>
    <div class="fi" style="left:66%;animation-duration:20s;animation-delay:3s;font-size:1rem"><i
        class="fa-solid fa-star" style="color:#d4a017"></i></div>
    <div class="fi" style="left:83%;animation-duration:24s;animation-delay:7s;font-size:1.6rem"><i
        class="fa-solid fa-mosque" style="color:#1a6b3a"></i></div>
  </div>

  <div class="wrap">
    <div class="card">
      <div class="logo">
        <span class="logo-icon"><i class="fa-solid fa-mosque" style="color:#d4a017"></i></span>
        <div class="logo-name">دار <em>التحفيظ</em></div>
        <div class="logo-sub">نظام الإدارة الإلكتروني</div>
      </div>

      <div class="tabs">
        <button class="tab active" id="tab-admin" onclick="setRole('admin')">
          <i class="fa-solid fa-shield-halved"></i> أدمن
        </button>
        <button class="tab" id="tab-teacher" onclick="setRole('teacher')">
          <i class="fa-solid fa-chalkboard-user"></i> معلم
        </button>
      </div>

      <div class="field">
        <label><i class="fa-solid fa-envelope"></i> البريد الإلكتروني</label>
        <div class="fw">
          <i class="fi-ico fa-solid fa-envelope"></i>
          <input class="input" type="email" id="email" placeholder="example@dar.com" autocomplete="email"
            inputmode="email">
        </div>
      </div>

      <div class="field">
        <label><i class="fa-solid fa-lock"></i> كلمة المرور</label>
        <div class="fw">
          <i class="fi-ico fa-solid fa-lock"></i>
          <input class="input" type="password" id="password" placeholder="••••••••" autocomplete="current-password">
          <button class="eye" onclick="togglePass()" id="eye-btn" type="button">
            <i class="fa-solid fa-eye" id="eye-ico"></i>
          </button>
        </div>
      </div>

      <div class="err-box" id="err-box" style="display:none">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="err-msg"></span>
      </div>

      <button class="submit" id="submit-btn" onclick="doLogin()">
        <span id="btn-content"><i class="fa-solid fa-right-to-bracket"></i> دخول</span>
      </button>

      <div class="verse">
        <p>﴿ إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ ﴾</p>
      </div>
      <div class="foot">دار التحفيظ © 2024 — جميع الحقوق محفوظة</div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (Auth.token) window.location.href = 'dashboard.html';

    function setRole(r) {
      document.getElementById('tab-admin').classList.toggle('active', r === 'admin');
      document.getElementById('tab-teacher').classList.toggle('active', r === 'teacher');
      hideErr();
      document.getElementById('email').value = '';
      document.getElementById('password').value = '';
      document.getElementById('email').classList.remove('err');
      document.getElementById('password').classList.remove('err');
      setTimeout(() => document.getElementById('email').focus(), 100);
    }

    function togglePass() {
      const inp = document.getElementById('password');
      const ico = document.getElementById('eye-ico');
      if (inp.type === 'password') { inp.type = 'text'; ico.className = 'fa-solid fa-eye-slash'; }
      else { inp.type = 'password'; ico.className = 'fa-solid fa-eye'; }
    }

    function showErr(msg) {
      const el = document.getElementById('err-box');
      document.getElementById('err-msg').textContent = msg;
      el.style.display = 'flex';
    }
    function hideErr() { document.getElementById('err-box').style.display = 'none'; }

    async function doLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      hideErr();
      document.getElementById('email').classList.remove('err');
      document.getElementById('password').classList.remove('err');

      if (!email) {
        document.getElementById('email').classList.add('err');
        showErr('أدخل البريد الإلكتروني'); return;
      }
      if (!password) {
        document.getElementById('password').classList.add('err');
        showErr('أدخل كلمة المرور'); return;
      }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spin"></div>';

      const res = await Auth.login(email, password);
      if (res.success) {
        btn.innerHTML = '<i class="fa-solid fa-circle-check"></i> جارٍ الدخول...';
        setTimeout(() => window.location.href = 'dashboard.html', 400);
      } else {
        showErr(res.message || 'بيانات غير صحيحة');
        document.getElementById('email').classList.add('err');
        document.getElementById('password').classList.add('err');
        btn.disabled = false;
        btn.innerHTML = '<span id="btn-content"><i class="fa-solid fa-right-to-bracket"></i> دخول</span>';
      }
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    if (window.innerWidth > 480) document.getElementById('email').focus();
  </script>
</body>

</html>
